<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票星球 · Vote Planet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗳️</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap');

        /* ============ Theme Tokens (accent pair per theme) ============ */
        :root {
            --accent-1: #ff6b9d;
            --accent-2: #c084fc;
            --accent-glow: rgba(255, 107, 157, 0.45);
            --bg-deep: #0a0c16;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-strong: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f2f3f7;
            --text-secondary: rgba(242, 243, 247, 0.62);
            --text-faint: rgba(242, 243, 247, 0.38);
        }

        [data-theme="blue"] {
            --accent-1: #38bdf8;
            --accent-2: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.45);
        }

        [data-theme="green"] {
            --accent-1: #34d399;
            --accent-2: #a3e635;
            --accent-glow: rgba(52, 211, 153, 0.45);
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Quicksand', 'ZCOOL KuaiLe', -apple-system, sans-serif;
            background: var(--bg-deep);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* ============ Aurora Background ============ */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            transition: background 0.8s;
        }

        .aurora .blob:nth-child(1) {
            width: 55vmax; height: 55vmax;
            top: -20vmax; left: -15vmax;
            background: var(--accent-1);
            animation: drift1 22s ease-in-out infinite alternate;
        }

        .aurora .blob:nth-child(2) {
            width: 45vmax; height: 45vmax;
            bottom: -18vmax; right: -12vmax;
            background: var(--accent-2);
            animation: drift2 26s ease-in-out infinite alternate;
        }

        .aurora .blob:nth-child(3) {
            width: 30vmax; height: 30vmax;
            top: 40%; left: 55%;
            background: var(--accent-1);
            opacity: 0.3;
            animation: drift3 18s ease-in-out infinite alternate;
        }

        @keyframes drift1 {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(8vmax, 6vmax) scale(1.15); }
        }
        @keyframes drift2 {
            from { transform: translate(0, 0) scale(1.1); }
            to   { transform: translate(-7vmax, -8vmax) scale(0.95); }
        }
        @keyframes drift3 {
            from { transform: translate(0, 0) rotate(0deg); }
            to   { transform: translate(-10vmax, 5vmax) rotate(40deg); }
        }

        /* Twinkling stars */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px; height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50%      { opacity: 0.9;  transform: scale(1.2); }
        }

        /* ============ Layout ============ */
        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            background: rgba(13, 15, 26, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        @media (min-width: 481px) {
            .container {
                min-height: auto;
                margin: 24px;
                border-radius: 28px;
                overflow: hidden;
                height: 92vh;
                border: 1px solid var(--glass-border);
                box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 60px var(--accent-glow);
            }
        }

        /* ============ Header ============ */
        .header {
            padding: 22px 24px;
            text-align: center;
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
        }

        .header .planet {
            font-size: 26px;
            margin-right: 10px;
            -webkit-text-fill-color: initial;
            animation: planetFloat 4s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes planetFloat {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50%      { transform: translateY(-5px) rotate(8deg); }
        }

        .theme-selector {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .theme-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: all 0.25s;
            padding: 0;
        }

        .theme-btn:hover { transform: scale(1.25); }

        .theme-btn.active {
            border-color: #fff;
            transform: scale(1.25);
            box-shadow: 0 0 12px currentColor;
        }

        .content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* ============ Screens ============ */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            flex: 1;
        }

        .screen.active {
            display: flex;
            animation: screenIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes screenIn {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============ Typography ============ */
        h2 {
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            color: var(--text-main);
            font-weight: 400;
            letter-spacing: 1px;
        }

        p { color: var(--text-secondary); }

        small { color: var(--text-faint); display: block; margin-top: 6px; }

        /* ============ Mode Cards (Start Screen) ============ */
        .mode-card {
            position: relative;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            border-radius: 22px;
            padding: 26px 22px;
            cursor: pointer;
            text-align: left;
            color: var(--text-main);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mode-card:hover, .mode-card:active {
            transform: translateY(-4px) scale(1.02);
            border-color: transparent;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--accent-glow);
        }

        .mode-card:hover::before, .mode-card:active::before { opacity: 0.9; }

        .mode-card > * { position: relative; z-index: 1; }

        .mode-card .mode-emoji {
            font-size: 44px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
            transition: transform 0.3s;
        }

        .mode-card:hover .mode-emoji { transform: scale(1.15) rotate(-8deg); }

        .mode-card .mode-title {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 21px;
            letter-spacing: 1px;
        }

        .mode-card .mode-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            transition: color 0.3s;
        }

        .mode-card:hover .mode-desc { color: rgba(255,255,255,0.85); }

        .hero-emoji {
            text-align: center;
            font-size: 74px;
            margin: 10px 0 4px;
            animation: heroBob 3.5s ease-in-out infinite;
            filter: drop-shadow(0 10px 24px var(--accent-glow));
        }

        @keyframes heroBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        /* ============ Form ============ */
        .form-group {
            margin-bottom: 20px;
            background: var(--glass);
            padding: 18px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            transition: border-color 0.3s;
        }

        .form-group:focus-within { border-color: var(--accent-1); }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-main);
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        /* Stepper for number inputs */
        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stepper button {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: var(--glass-strong);
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .stepper button:hover { background: var(--accent-1); border-color: transparent; }
        .stepper button:active { transform: scale(0.9); }

        .stepper input { text-align: center; font-weight: 700; font-size: 20px; }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .toggle {
            position: relative;
            width: 52px;
            height: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.12);
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .toggle.on { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); }
        .toggle.on::after { transform: translateX(22px); }

        /* ============ Buttons ============ */
        .btn {
            position: relative;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            border: none;
            padding: 17px;
            border-radius: 50px;
            font-size: 17px;
            font-family: 'ZCOOL KuaiLe', 'Quicksand', sans-serif;
            letter-spacing: 2px;
            width: 100%;
            cursor: pointer;
            margin-top: auto;
            box-shadow: 0 10px 28px var(--accent-glow);
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 16px 36px var(--accent-glow); }
        .btn:active { transform: translateY(1px) scale(0.98); }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            box-shadow: none;
            margin-top: 14px;
            font-family: 'Quicksand', sans-serif;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .btn-outline:hover {
            border-color: var(--accent-1);
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-random {
            background: var(--glass-strong);
            border: 1px solid var(--glass-border);
            box-shadow: none;
            backdrop-filter: blur(8px);
        }

        .btn-random:hover { border-color: var(--accent-2); box-shadow: 0 10px 28px var(--accent-glow); }

        .btn-back {
            width: auto;
            align-self: flex-start;
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 14px;
        }

        .img-btn-add {
            border: 2px dashed var(--accent-1) !important;
            color: var(--accent-1) !important;
            background: transparent !important;
            border-radius: 14px;
            padding: 13px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: none !important;
            margin-top: 4px;
            width: 100%;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-btn-add:hover { background: var(--glass) !important; }

        /* ============ Option Editor ============ */
        .option-item {
            display: flex;
            align-items: center;
            padding: 6px 0;
            animation: optionIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes optionIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .option-item input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--glass-border);
            border-radius: 0;
            padding: 10px 2px;
            font-weight: 600;
        }

        .option-item input:focus { border-color: var(--accent-1); box-shadow: none; }

        .delete-btn {
            color: var(--text-faint);
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 10px;
            transition: all 0.25s;
        }

        .delete-btn:hover { color: #ff5470; transform: scale(1.2) rotate(90deg); }

        /* ============ Voting ============ */
        .voter-progress {
            display: flex;
            justify-content: center;
            gap: 7px;
            margin: 14px 0 4px;
        }

        .voter-progress .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }

        .voter-progress .dot.done { background: var(--accent-1); opacity: 0.55; }
        .voter-progress .dot.now {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            transform: scale(1.35);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .vote-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 17px 18px;
            border: 1px solid var(--glass-border);
            margin-bottom: 12px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            background: var(--glass);
            position: relative;
            overflow: hidden;
            animation: optionIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .vote-option:hover { border-color: var(--accent-2); transform: translateX(4px); }

        .vote-option.selected {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-color: transparent;
            box-shadow: 0 10px 26px var(--accent-glow);
            transform: scale(1.02);
        }

        .vote-option input { display: none; }

        .vote-option .check {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid var(--text-faint);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: transparent;
            transition: all 0.25s;
        }

        .vote-option.selected .check {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            animation: checkPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes checkPop {
            0%   { transform: scale(0.4); }
            70%  { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .vote-option .opt-text { font-weight: 700; font-size: 16px; }
        .vote-option .opt-emoji { font-size: 26px; }

        /* Roulette flash during random pick */
        .vote-option.roulette {
            border-color: var(--accent-1);
            background: var(--glass-strong);
            box-shadow: 0 0 18px var(--accent-glow);
        }

        /* ============ Transition Screen ============ */
        .transition-box { text-align: center; margin: auto 0; }

        .lock-ring {
            position: relative;
            width: 130px; height: 130px;
            margin: 0 auto 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lock-ring::before, .lock-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent-1);
            animation: ringPulse 2s ease-out infinite;
        }

        .lock-ring::after { animation-delay: 1s; }

        @keyframes ringPulse {
            from { transform: scale(0.75); opacity: 0.9; }
            to   { transform: scale(1.5); opacity: 0; }
        }

        .lock-ring .huge-icon {
            font-size: 64px;
            animation: lockWiggle 2.4s ease-in-out infinite;
        }

        @keyframes lockWiggle {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .next-voter-num {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 30px;
        }

        /* ============ Results ============ */
        .winner-banner {
            text-align: center;
            padding: 26px 18px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 16px 40px var(--accent-glow);
            margin-bottom: 20px;
            animation: winnerIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @keyframes winnerIn {
            from { opacity: 0; transform: scale(0.6); }
            to   { opacity: 1; transform: scale(1); }
        }

        .winner-banner .crown {
            font-size: 46px;
            display: block;
            animation: crownBob 2s ease-in-out infinite;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.3));
        }

        @keyframes crownBob {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50%      { transform: translateY(-8px) rotate(6deg); }
        }

        .winner-banner .winner-name {
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-size: 26px;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .winner-banner .winner-sub { color: rgba(255,255,255,0.85); font-size: 14px; margin-top: 4px; }

        .result-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 16px 18px;
            margin-bottom: 12px;
            border-radius: 18px;
            animation: optionIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .result-item .result-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-item .result-name { font-weight: 700; font-size: 16px; }

        .result-count {
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }

        .result-bar-track {
            height: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .result-bar {
            height: 100%;
            width: 0;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .result-item.is-winner { border-color: var(--accent-1); box-shadow: 0 0 24px var(--accent-glow); }

        .round-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 14px;
            animation: optionIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .round-card h3 {
            margin: 0 0 10px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            font-weight: 400;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .duel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            margin: 6px 0;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 12px;
            font-size: 14px;
        }

        .duel-row .duel-tag {
            font-weight: 800;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .duel-tag.win  { background: rgba(52, 211, 153, 0.2);  color: #34d399; }
        .duel-tag.lose { background: rgba(255, 84, 112, 0.2);  color: #ff5470; }
        .duel-tag.draw { background: rgba(250, 204, 21, 0.18); color: #facc15; }

        .score-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin: 6px 0;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 12px;
        }

        .score-rank {
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            background: var(--glass-strong);
            flex-shrink: 0;
        }

        .score-row.first .score-rank {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #422006;
            box-shadow: 0 0 14px rgba(251, 191, 36, 0.5);
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            z-index: 99;
            pointer-events: none;
        }

        /* Scrollbar */
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 6px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="aurora">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>
<div class="stars" id="stars"></div>
<canvas id="confetti-canvas"></canvas>

<div class="container">
    <div class="header">
        <div class="theme-selector">
            <button class="theme-btn active" style="background: linear-gradient(135deg,#ff6b9d,#c084fc); color:#ff6b9d;" onclick="switchTheme('pink', this)" title="星云粉"></button>
            <button class="theme-btn" style="background: linear-gradient(135deg,#38bdf8,#818cf8); color:#38bdf8;" onclick="switchTheme('blue', this)" title="极光蓝"></button>
            <button class="theme-btn" style="background: linear-gradient(135deg,#34d399,#a3e635); color:#34d399;" onclick="switchTheme('green', this)" title="萤火绿"></button>
        </div>
        <span class="planet">🪐</span>投票星球
    </div>

    <div class="content">

        <!-- 1. START SCREEN -->
        <div id="start-screen" class="screen active">
            <div class="hero-emoji">🗳️</div>
            <h2 style="text-align: center; margin: 6px 0 4px;">今天，听谁的？</h2>
            <p style="text-align: center; margin-top: 0; margin-bottom: 30px; font-size: 14px;">聚会选择困难症，交给民主与运气</p>

            <div style="display: flex; flex-direction: column; gap: 16px;">
                <button class="mode-card" onclick="goToVotingSetup()">
                    <span class="mode-emoji">🗳️</span>
                    <span>
                        <span class="mode-title">普通投票</span>
                        <div class="mode-desc">吃饭 / 目的地 / 活动，一人一票见分晓</div>
                    </span>
                </button>
                <button class="mode-card" onclick="goToRpsSetup()">
                    <span class="mode-emoji">✊</span>
                    <span>
                        <span class="mode-title">石头剪刀布</span>
                        <div class="mode-desc">轮流密选出拳，多轮混战决出天选之人</div>
                    </span>
                </button>
            </div>
        </div>

        <!-- 2. VOTING SETUP SCREEN -->
        <div id="voting-setup-screen" class="screen">
            <button class="btn btn-outline btn-back" onclick="goToStartScreen()">← 返回</button>

            <div class="form-group">
                <label>投票人数</label>
                <div class="stepper">
                    <button type="button" onclick="stepInput('voter-count', -1)">−</button>
                    <input type="number" id="voter-count" value="3" min="1">
                    <button type="button" onclick="stepInput('voter-count', 1)">＋</button>
                </div>
            </div>

            <div class="form-group">
                <label>投票模式</label>
                <div class="toggle-row" onclick="toggleMultiSelect()">
                    <span style="font-size: 15px;">允许每人选多项（多选）</span>
                    <div class="toggle" id="multi-toggle"></div>
                </div>
                <input type="checkbox" id="multi-select" style="display:none;">
            </div>

            <div class="form-group">
                <label>选项列表（可直接修改）</label>
                <div id="options-list-container"></div>
                <button class="btn img-btn-add" onclick="addNewOptionEntry()">
                    <span style="font-size: 22px; margin-right: 6px; line-height: 1;">+</span> 添加选项
                </button>
            </div>

            <button class="btn" onclick="startVoting()">🚀 开始投票</button>
            <button class="btn btn-outline" onclick="resetSetupForm()">清空选项</button>
        </div>

        <!-- 3. RPS SETUP SCREEN -->
        <div id="rps-setup-screen" class="screen">
            <button class="btn btn-outline btn-back" onclick="goToStartScreen()">← 返回</button>

            <div class="form-group">
                <label>玩家人数</label>
                <div class="stepper">
                    <button type="button" onclick="stepInput('rps-player-count', -1)">−</button>
                    <input type="number" id="rps-player-count" value="2" min="2">
                    <button type="button" onclick="stepInput('rps-player-count', 1)">＋</button>
                </div>
            </div>

            <div class="form-group">
                <label>石头剪刀布轮数</label>
                <div class="stepper">
                    <button type="button" onclick="stepInput('rps-rounds', -1)">−</button>
                    <input type="number" id="rps-rounds" value="1" min="1" max="10">
                    <button type="button" onclick="stepInput('rps-rounds', 1)">＋</button>
                </div>
                <small>设置为 1 时为单轮模式，大于 1 时为多轮模式</small>
            </div>

            <button class="btn" onclick="startRPSGame()">🎮 开始游戏</button>
        </div>

        <!-- 4. VOTING SCREEN -->
        <div id="voting-screen" class="screen">
            <button class="btn btn-outline btn-back" onclick="goToSetupScreen()">← 返回</button>
            <h2 style="text-align: center; margin-bottom: 2px;">第 <span id="current-voter-num">1</span> 位玩家</h2>
            <p style="text-align: center; margin-top: 0; font-size: 14px;">共 <span id="total-voters-disp"></span> 人 · 请秘密选择 🤫</p>

            <div class="voter-progress" id="voter-progress"></div>

            <div id="ballot-box" style="margin-top: 18px;"></div>

            <div style="margin-top: 20px; border-top: 1px dashed var(--glass-border); padding-top: 20px;">
                <button class="btn btn-random" onclick="voteRandom()">🎲 命运的转盘，随机！</button>
                <br>
                <button class="btn" onclick="submitVote()" style="margin-top: 15px;">确认选择 ✓</button>
            </div>
        </div>

        <!-- 5. TRANSITION SCREEN (PRIVACY) -->
        <div id="transition-screen" class="screen">
            <div class="transition-box">
                <div class="lock-ring"><div class="huge-icon">🔒</div></div>
                <h2>选择已密封提交</h2>
                <p>请将设备交给下一位玩家</p>
                <p class="next-voter-num">第 <span id="next-voter-num">2</span> 位</p>

                <button class="btn" onclick="nextVoterReady()" style="margin-top: 36px;">我是下一位，开始选择</button>
            </div>
        </div>

        <!-- 6. RESULTS SCREEN -->
        <div id="results-screen" class="screen">
            <button class="btn btn-outline btn-back" onclick="goToStartScreen()">← 返回</button>
            <h2 id="results-title" style="margin-bottom: 2px;">投票结果</h2>
            <p id="results-subtitle" style="margin-top: 0; font-size: 14px;">总票数: <span id="total-votes-count">0</span></p>

            <div id="results-list"></div>

            <button class="btn btn-outline" onclick="restartApp()">🔄 重新开始</button>
        </div>

    </div>
</div>

<script>
    // ================= State =================
    let appState = {
        totalVoters: 0,
        currentVoter: 1,
        options: ["选项 A", "选项 B"],
        isMultiSelect: false,
        gameMode: 'normal',
        rpsRounds: 1,
        votes: {},
        rpsResults: []
    };

    const RPS_EMOJI = { '石头': '✊', '剪刀': '✌️', '布': '🖐' };
    let rouletteBusy = false;

    function vibrate(ms) {
        if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {}
    }

    // ================= Stars & Confetti =================
    (function initStars() {
        const box = document.getElementById('stars');
        for (let i = 0; i < 40; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = (Math.random() * 3) + 's';
            s.style.animationDuration = (2 + Math.random() * 3) + 's';
            const size = 1 + Math.random() * 2.5;
            s.style.width = s.style.height = size + 'px';
            box.appendChild(s);
        }
    })();

    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiRunning = false;

    function resizeConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchConfetti(count) {
        const colors = ['#ff6b9d', '#c084fc', '#38bdf8', '#34d399', '#facc15', '#ffffff'];
        for (let i = 0; i < count; i++) {
            confettiParticles.push({
                x: Math.random() * confettiCanvas.width,
                y: -20 - Math.random() * confettiCanvas.height * 0.4,
                w: 6 + Math.random() * 7,
                h: 8 + Math.random() * 10,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: 2 + Math.random() * 3.5,
                vx: -1.5 + Math.random() * 3,
                rot: Math.random() * Math.PI * 2,
                vr: -0.15 + Math.random() * 0.3,
                shape: Math.random() > 0.5 ? 'rect' : 'circle'
            });
        }
        if (!confettiRunning) {
            confettiRunning = true;
            requestAnimationFrame(confettiTick);
        }
    }

    function confettiTick() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiParticles = confettiParticles.filter(p => p.y < confettiCanvas.height + 30);
        confettiParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.rot += p.vr;
            p.vy = Math.min(p.vy + 0.03, 5);
            confettiCtx.save();
            confettiCtx.translate(p.x, p.y);
            confettiCtx.rotate(p.rot);
            confettiCtx.fillStyle = p.color;
            if (p.shape === 'rect') confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            else { confettiCtx.beginPath(); confettiCtx.arc(0, 0, p.w / 2, 0, Math.PI * 2); confettiCtx.fill(); }
            confettiCtx.restore();
        });
        if (confettiParticles.length > 0) requestAnimationFrame(confettiTick);
        else { confettiRunning = false; confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }
    }

    // ================= Theme =================
    function switchTheme(theme, btn) {
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        vibrate(8);
    }

    // ================= Navigation =================
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.querySelector('.content').scrollTop = 0;
    }

    function goToStartScreen() { showScreen('start-screen'); }

    function goToVotingSetup() {
        showScreen('voting-setup-screen');
        appState.gameMode = 'normal';
    }

    function goToRpsSetup() {
        showScreen('rps-setup-screen');
        appState.gameMode = 'rock-paper-scissors';
    }

    function goToSetupScreen() {
        showScreen(appState.gameMode === 'rock-paper-scissors' ? 'rps-setup-screen' : 'voting-setup-screen');
    }

    // ================= Setup Helpers =================
    function stepInput(id, delta) {
        const input = document.getElementById(id);
        const min = parseInt(input.min) || 1;
        const max = parseInt(input.max) || 99;
        let val = (parseInt(input.value) || min) + delta;
        val = Math.max(min, Math.min(max, val));
        input.value = val;
        vibrate(8);
    }

    function toggleMultiSelect() {
        const cb = document.getElementById('multi-select');
        cb.checked = !cb.checked;
        document.getElementById('multi-toggle').classList.toggle('on', cb.checked);
        vibrate(10);
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderOptionsList() {
        const container = document.getElementById('options-list-container');
        container.innerHTML = '';
        appState.options.forEach((opt, index) => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerHTML = `
                <span style="margin-right: 8px; font-weight: bold; color: var(--text-faint);">${index + 1}.</span>
                <input type="text"
                       value="${escapeHtml(opt)}"
                       oninput="updateOption(${index}, this.value)"
                       style="flex: 1; margin: 0;"
                       placeholder="请输入选项名称">
                <button class="delete-btn" onclick="removeOption(${index})">×</button>
            `;
            container.appendChild(div);
        });
    }

    function updateOption(index, value) { appState.options[index] = value; }

    function addNewOptionEntry() {
        let nextCharCode = 65 + appState.options.length;
        let newName = nextCharCode > 90 ? "新选项" : "选项 " + String.fromCharCode(nextCharCode);
        appState.options.push(newName);
        renderOptionsList();
        vibrate(10);
        const inputs = document.querySelectorAll('#options-list-container input');
        if (inputs.length) inputs[inputs.length - 1].focus();
    }

    function removeOption(index) {
        if (appState.options.length <= 2) { alert('至少需要保留两个选项'); return; }
        appState.options.splice(index, 1);
        renderOptionsList();
        vibrate(10);
    }

    function resetSetupForm() {
        if (!confirm('确定要清空当前设置吗？这将恢复默认状态。')) return;
        document.getElementById('voter-count').value = "3";
        document.getElementById('multi-select').checked = false;
        document.getElementById('multi-toggle').classList.remove('on');
        appState.options = ["选项 A", "选项 B"];
        renderOptionsList();
    }

    // ================= Game Start =================
    function startVoting() {
        const count = parseInt(document.getElementById('voter-count').value);
        if (!count || count < 1) { alert('请输入有效的投票人数'); return; }

        appState.options = appState.options.map(o => o.trim());
        if (appState.options.some(o => o === "")) { alert('存在空白的选项名称，请修改或删除'); return; }
        if (appState.options.length < 2) { alert('至少添加两个选项'); return; }
        if (new Set(appState.options).size !== appState.options.length) { alert('选项名称不能重复，请修改重复的选项名称'); return; }

        appState.totalVoters = count;
        appState.currentVoter = 1;
        appState.isMultiSelect = document.getElementById('multi-select').checked;
        appState.votes = {};
        appState.options.forEach(opt => appState.votes[opt] = 0);
        appState.rpsResults = [];

        loadVotingScreen();
    }

    function startRPSGame() {
        const count = parseInt(document.getElementById('rps-player-count').value);
        if (!count || count < 2) { alert('请输入有效的玩家人数（至少2人）'); return; }

        const rounds = parseInt(document.getElementById('rps-rounds').value);
        if (!rounds || rounds < 1 || rounds > 10) { alert('请输入有效的轮数（1-10）'); return; }

        appState.totalVoters = count;
        appState.currentVoter = 1;
        appState.rpsRounds = rounds;
        appState.options = ['石头', '剪刀', '布'];
        appState.votes = {};
        appState.options.forEach(opt => appState.votes[opt] = 0);
        appState.rpsResults = [];

        loadVotingScreen();
    }

    // ================= Voting Screen =================
    function renderVoterProgress() {
        const box = document.getElementById('voter-progress');
        box.innerHTML = '';
        for (let i = 1; i <= appState.totalVoters; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i < appState.currentVoter ? ' done' : i === appState.currentVoter ? ' now' : '');
            box.appendChild(dot);
        }
    }

    function buildVoteOption(opt, type, name, stagger) {
        const label = document.createElement('label');
        label.className = 'vote-option';
        label.style.animationDelay = (stagger * 0.06) + 's';
        const emoji = RPS_EMOJI[opt] ? `<span class="opt-emoji">${RPS_EMOJI[opt]}</span>` : '';
        label.innerHTML = `
            <input type="${type}" name="${name}" value="${escapeHtml(opt)}">
            <span class="check">✓</span>
            ${emoji}
            <span class="opt-text">${escapeHtml(opt)}</span>
        `;
        label.onclick = (e) => {
            e.preventDefault(); // 阻止 label 默认激活，避免与手动切换叠加
            if (rouletteBusy) return;
            const input = label.querySelector('input');
            if (type === 'radio') input.checked = true;
            else input.checked = !input.checked;
            updateSelectionUI();
            vibrate(12);
        };
        return label;
    }

    function loadVotingScreen() {
        showScreen('voting-screen');
        document.getElementById('current-voter-num').textContent = appState.currentVoter;
        document.getElementById('total-voters-disp').textContent = appState.totalVoters;
        renderVoterProgress();

        const container = document.getElementById('ballot-box');
        container.innerHTML = '';

        if (appState.gameMode === 'rock-paper-scissors' && appState.rpsRounds > 1) {
            // 多轮模式
            for (let round = 1; round <= appState.rpsRounds; round++) {
                const roundDiv = document.createElement('div');
                roundDiv.style.marginBottom = '18px';
                roundDiv.innerHTML = `<h4 style="margin: 0 0 10px; font-family:'ZCOOL KuaiLe',sans-serif; font-weight:400; letter-spacing:1px; color: var(--text-secondary);">— 第 ${round} 轮 —</h4>`;
                appState.options.forEach((opt, i) => {
                    roundDiv.appendChild(buildVoteOption(opt, 'radio', 'rps-round-' + round, (round - 1) * 3 + i));
                });
                container.appendChild(roundDiv);
            }
        } else {
            const type = appState.isMultiSelect ? 'checkbox' : 'radio';
            const name = appState.isMultiSelect ? 'vote-opt' : 'vote-opt-radio';
            appState.options.forEach((opt, i) => {
                container.appendChild(buildVoteOption(opt, type, name, i));
            });
        }
    }

    function updateSelectionUI() {
        document.querySelectorAll('.vote-option').forEach(el => {
            const input = el.querySelector('input');
            el.classList.toggle('selected', input.checked);
        });
    }

    // ================= Random Vote (Roulette) =================
    function voteRandom() {
        if (rouletteBusy) return;

        const multiRound = appState.gameMode === 'rock-paper-scissors' && appState.rpsRounds > 1;
        rouletteBusy = true;
        vibrate(20);

        const doCommit = () => {
            rouletteBusy = false;
            if (multiRound) {
                const selections = [];
                for (let round = 1; round <= appState.rpsRounds; round++) {
                    selections.push(appState.options[Math.floor(Math.random() * appState.options.length)]);
                }
                appState.rpsResults.push({ voter: appState.currentVoter, selections: selections });
            } else {
                const randomOption = appState.options[Math.floor(Math.random() * appState.options.length)];
                appState.votes[randomOption]++;
                if (appState.gameMode === 'rock-paper-scissors') {
                    appState.rpsResults.push({ voter: appState.currentVoter, selections: [randomOption] });
                }
            }
            finishVoterTurn();
        };

        if (multiRound) { doCommit(); return; }

        // 轮盘动画：快速闪烁各选项后停在随机项
        const rows = Array.from(document.querySelectorAll('#ballot-box .vote-option'));
        if (!rows.length) { doCommit(); return; }

        const targetIndex = Math.floor(Math.random() * rows.length);
        let ticks = 0;
        const totalTicks = 14 + targetIndex;
        const spin = () => {
            rows.forEach(r => r.classList.remove('roulette', 'selected'));
            const idx = ticks % rows.length;
            rows[idx].classList.add('roulette');
            vibrate(6);
            ticks++;
            if (ticks <= totalTicks) {
                const delay = 60 + Math.pow(ticks / totalTicks, 2) * 220;
                setTimeout(spin, delay);
            } else {
                rows.forEach(r => r.classList.remove('roulette'));
                const input = rows[targetIndex].querySelector('input');
                input.checked = true;
                updateSelectionUI();
                vibrate(40);
                setTimeout(doCommit, 600);
            }
        };
        spin();
    }

    // ================= Submit =================
    function submitVote() {
        if (rouletteBusy) return;

        if (appState.gameMode === 'rock-paper-scissors' && appState.rpsRounds > 1) {
            const selections = [];
            for (let round = 1; round <= appState.rpsRounds; round++) {
                const input = document.querySelector(`input[name="rps-round-${round}"]:checked`);
                if (!input) { alert(`请为第 ${round} 轮选择一个选项`); return; }
                selections.push(input.value);
            }
            appState.rpsResults.push({ voter: appState.currentVoter, selections: selections });
        } else {
            const inputs = document.querySelectorAll('#ballot-box input');
            let selected = [];
            inputs.forEach(input => { if (input.checked) selected.push(input.value); });

            if (selected.length === 0) { alert('请至少选择一项，或者点击随机投票'); return; }

            selected.forEach(opt => { appState.votes[opt]++; });

            if (appState.gameMode === 'rock-paper-scissors') {
                appState.rpsResults.push({ voter: appState.currentVoter, selections: selected });
            }
        }

        vibrate(30);
        finishVoterTurn();
    }

    function finishVoterTurn() {
        if (appState.currentVoter < appState.totalVoters) {
            appState.currentVoter++;
            document.getElementById('next-voter-num').textContent = appState.currentVoter;
            showScreen('transition-screen');
        } else {
            showResults();
        }
    }

    function nextVoterReady() { loadVotingScreen(); }

    // ================= Results =================
    function getRPSResult(player1, player2) {
        if (player1 === player2) return '平局';
        if ((player1 === '石头' && player2 === '剪刀') ||
            (player1 === '剪刀' && player2 === '布') ||
            (player1 === '布' && player2 === '石头')) return '胜利';
        return '失败';
    }

    function showResults() {
        showScreen('results-screen');
        const list = document.getElementById('results-list');
        const resultsTitle = document.getElementById('results-title');
        const resultsSubtitle = document.getElementById('results-subtitle');
        list.innerHTML = '';

        if (appState.gameMode === 'rock-paper-scissors') {
            renderRPSResults(list, resultsTitle, resultsSubtitle);
        } else {
            renderVoteResults(list, resultsTitle, resultsSubtitle);
        }

        launchConfetti(160);
        vibrate([60, 40, 60]);
    }

    function renderVoteResults(list, resultsTitle, resultsSubtitle) {
        resultsTitle.textContent = '投票结果';
        resultsSubtitle.style.display = 'block';

        const sorted = Object.entries(appState.votes).sort((a, b) => b[1] - a[1]);
        let totalVotes = 0;
        sorted.forEach(([, count]) => totalVotes += count);

        const topCount = sorted.length ? sorted[0][1] : 0;
        const winners = sorted.filter(([, c]) => c === topCount && c > 0);

        // Winner banner
        if (winners.length > 0) {
            const banner = document.createElement('div');
            banner.className = 'winner-banner';
            banner.innerHTML = `
                <span class="crown">👑</span>
                <div class="winner-name">${winners.map(([o]) => escapeHtml(o)).join(' & ')}</div>
                <div class="winner-sub">${winners.length > 1 ? '平票冠军' : '全场最佳'} · ${topCount} 票</div>
            `;
            list.appendChild(banner);
        }

        sorted.forEach(([opt, count], i) => {
            const pct = totalVotes > 0 ? Math.round(count / totalVotes * 100) : 0;
            const div = document.createElement('div');
            div.className = 'result-item' + (count === topCount && count > 0 ? ' is-winner' : '');
            div.style.animationDelay = (0.15 + i * 0.08) + 's';
            div.innerHTML = `
                <div class="result-head">
                    <span class="result-name">${escapeHtml(opt)}</span>
                    <span class="result-count">${count} 票 · ${pct}%</span>
                </div>
                <div class="result-bar-track"><div class="result-bar" data-pct="${pct}"></div></div>
            `;
            list.appendChild(div);
        });

        document.getElementById('total-votes-count').textContent = totalVotes;

        // Animate bars after render
        requestAnimationFrame(() => {
            setTimeout(() => {
                list.querySelectorAll('.result-bar').forEach(bar => {
                    bar.style.width = bar.dataset.pct + '%';
                });
            }, 250);
        });
    }

    function renderRPSResults(list, resultsTitle, resultsSubtitle) {
        resultsTitle.textContent = '游戏结果';
        resultsSubtitle.style.display = 'none';

        if (appState.rpsResults.length < 2) {
            list.innerHTML = '<p style="text-align: center;">需要至少两名玩家才能进行石头剪刀布游戏</p>';
            return;
        }

        const playerScores = {};
        appState.rpsResults.forEach(r => playerScores[r.voter] = 0);

        const roundResults = [];
        for (let round = 0; round < appState.rpsRounds; round++) {
            const roundData = { round: round + 1, outcomes: [] };
            for (let i = 0; i < appState.rpsResults.length; i++) {
                for (let j = i + 1; j < appState.rpsResults.length; j++) {
                    const p1 = appState.rpsResults[i];
                    const p2 = appState.rpsResults[j];
                    const result = getRPSResult(p1.selections[round], p2.selections[round]);
                    roundData.outcomes.push({
                        player1: p1.voter, choice1: p1.selections[round],
                        player2: p2.voter, choice2: p2.selections[round],
                        result: result
                    });
                    if (result === '胜利') playerScores[p1.voter]++;
                    else if (result === '失败') playerScores[p2.voter]++;
                }
            }
            roundResults.push(roundData);
        }

        // 胜者横幅
        const sortedScores = Object.entries(playerScores).sort((a, b) => b[1] - a[1]);
        const topScore = sortedScores[0][1];
        const winners = sortedScores.filter(([, s]) => s === topScore);

        const banner = document.createElement('div');
        banner.className = 'winner-banner';
        banner.innerHTML = `
            <span class="crown">🏆</span>
            <div class="winner-name">${winners.map(([p]) => '玩家 ' + p).join(' & ')}</div>
            <div class="winner-sub">${winners.length > 1 ? '并列冠军' : '最终胜利者'} · ${topScore} 分</div>
        `;
        list.appendChild(banner);

        // 每轮对战
        roundResults.forEach((roundData, ri) => {
            const card = document.createElement('div');
            card.className = 'round-card';
            card.style.animationDelay = (0.15 + ri * 0.08) + 's';
            card.innerHTML = `<h3>🥊 第 ${roundData.round} 轮</h3>`;
            roundData.outcomes.forEach(o => {
                const row = document.createElement('div');
                row.className = 'duel-row';
                const tagClass = o.result === '胜利' ? 'win' : o.result === '失败' ? 'lose' : 'draw';
                const tagText = o.result === '胜利' ? `玩家${o.player1} 胜` : o.result === '失败' ? `玩家${o.player2} 胜` : '平局';
                row.innerHTML = `
                    <span>玩家${o.player1} ${RPS_EMOJI[o.choice1] || ''} <span style="color:var(--text-faint)">vs</span> ${RPS_EMOJI[o.choice2] || ''} 玩家${o.player2}</span>
                    <span class="duel-tag ${tagClass}">${tagText}</span>
                `;
                card.appendChild(row);
            });
            list.appendChild(card);
        });

        // 积分榜
        const scoreCard = document.createElement('div');
        scoreCard.className = 'round-card';
        scoreCard.style.animationDelay = (0.15 + roundResults.length * 0.08) + 's';
        scoreCard.innerHTML = `<h3>📊 积分榜</h3>`;
        sortedScores.forEach(([player, score], rank) => {
            const row = document.createElement('div');
            row.className = 'score-row' + (rank === 0 ? ' first' : '');
            row.innerHTML = `
                <span class="score-rank">${rank + 1}</span>
                <span style="flex:1;">玩家 ${player}</span>
                <strong style="font-size:17px;">${score} 分</strong>
            `;
            scoreCard.appendChild(row);
        });
        list.appendChild(scoreCard);
    }

    function restartApp() {
        if (confirm('确定要清空数据并重新开始吗？')) {
            appState.currentVoter = 1;
            appState.votes = {};
            appState.rpsResults = [];
            showScreen('start-screen');
        }
    }

    // ================= Init =================
    renderOptionsList();
</script>

</body>
</html>
